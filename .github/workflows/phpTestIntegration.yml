name: Integration tests

# One workflow, one matrix, one provisioning entry point.
# Each fixture target points at a compose file and a backend name; the
# rest of the pipeline is identical. Adding a new target means a new
# compose file, a new matrix row, and a new backend handler in
# _test/fixtures/provision.php.

on: [push, pull_request]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    integration:
        name: ${{ matrix.fixture.label }} (PHP ${{ matrix.php-version }}, DokuWiki ${{ matrix.dokuwiki-branch }})
        runs-on: ubuntu-latest
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.2']
                dokuwiki-branch: ['master']
                fixture:
                    - name: openldap
                      label: OpenLDAP
                      compose: _test/docker-compose.openldap.yml
                      container: pureldap-openldap
                      port: 1389
                      phpunit_group: plugin_pureldap_integration
                      phpunit_filter: ''
                    - name: samba
                      label: Samba AD-DC
                      compose: _test/docker-compose.samba.yml
                      container: pureldap-samba
                      port: 7389
                      phpunit_group: plugin_pureldap
                      phpunit_filter: '/^(ADClientTest|AuthTest|GroupHierarchyCacheTest)::/'

        env:
            COMPOSER: _test/composer.json
            COMPOSER_VENDOR_DIR: _test/vendor

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring, intl, PDO, pdo_sqlite, bz2

            - name: Setup problem matchers
              run: |
                echo ::add-matcher::${{ runner.tool_cache }}/php.json
                echo ::add-matcher::${{ runner.tool_cache }}/phpunit.json

            - name: Start ${{ matrix.fixture.label }} fixture
              # `compose run --rm` is the only invocation that gives a
              # firm "the provisioner has exited successfully" signal:
              # it starts dependencies (honouring depends_on service_healthy),
              # runs the provisioner attached, and returns its exit code.
              # `compose up --wait` returned too early on one-shot services,
              # so phpunit was racing against still-provisioning fixtures.
              run: |
                docker compose -f ${{ matrix.fixture.compose }} run --rm -T provisioner
                docker compose -f ${{ matrix.fixture.compose }} ps

            - name: Create DokuWiki environment
              uses: dokuwiki/github-action/.github/actions/dokuenv@main
              with:
                  branch: ${{ matrix.dokuwiki-branch }}

            - name: Install composer dependencies
              run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader --no-scripts

            - name: Run phpunit
              env:
                  LDAP_TEST_HOST: localhost
                  LDAP_TEST_PORT: ${{ matrix.fixture.port }}
                  PHPUNIT_GROUP: ${{ matrix.fixture.phpunit_group }}
                  PHPUNIT_FILTER: ${{ matrix.fixture.phpunit_filter }}
              run: |
                if [ -n "$PHPUNIT_FILTER" ]; then
                    composer exec -- phpunit -c _test/phpunit.xml --verbose --stderr \
                        --group "$PHPUNIT_GROUP" --filter "$PHPUNIT_FILTER"
                else
                    composer exec -- phpunit -c _test/phpunit.xml --verbose --stderr \
                        --group "$PHPUNIT_GROUP"
                fi

            - name: Dump fixture logs on failure
              if: failure()
              run: |
                docker compose -f ${{ matrix.fixture.compose }} ps -a
                docker compose -f ${{ matrix.fixture.compose }} logs --tail=300 || true
