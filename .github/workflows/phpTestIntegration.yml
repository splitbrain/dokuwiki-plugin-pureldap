name: Integration tests

# Brings up both LDAP services via docker compose, then drives the
# per-backend setup + provisioning via docker exec. The scripts handle
# their own wait-for-ready, so 'up -d' (no --wait) is enough — exec
# blocks until the script returns and exits non-zero on failure.
# (Compose's post_start lifecycle hook would be cleaner but requires
# v2.30+ and silently misbehaves on the ubuntu-latest runner.)

on: [push, pull_request]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    integration:
        name: Integration (PHP ${{ matrix.php-version }}, DokuWiki ${{ matrix.dokuwiki-branch }})
        runs-on: ubuntu-latest
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
        # `pull-requests: write` is needed so the failure-dump step can
        # post the captured output as a PR comment (see end of the steps).
        permissions:
            contents: read
            pull-requests: write

        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.2']
                dokuwiki-branch: ['master']

        env:
            COMPOSER: _test/composer.json
            COMPOSER_VENDOR_DIR: _test/vendor

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring, intl, PDO, pdo_sqlite, bz2

            - name: Setup problem matchers
              run: |
                echo ::add-matcher::${{ runner.tool_cache }}/php.json
                echo ::add-matcher::${{ runner.tool_cache }}/phpunit.json

            - name: Bring up fixtures
              run: |
                set -ex
                docker --version
                docker compose version
                docker compose -f _test/docker-compose.yml up -d
                docker compose -f _test/docker-compose.yml ps -a

            - name: Provision OpenLDAP
              run: |
                set -ex
                docker exec pureldap-openldap bash    /fixtures/openldap/setup.sh
                docker exec pureldap-openldap python3 /fixtures/openldap/provision.py

            - name: Provision Samba AD
              run: |
                set -ex
                docker exec pureldap-samba bash    /fixtures/samba/setup.sh
                docker exec pureldap-samba python3 /fixtures/samba/provision.py

            - name: Create DokuWiki environment
              uses: dokuwiki/github-action/.github/actions/dokuenv@main
              with:
                  branch: ${{ matrix.dokuwiki-branch }}

            - name: Install composer dependencies
              run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader --no-scripts

            - name: Run OpenLDAP tests
              env:
                  LDAP_TEST_HOST: localhost
                  LDAP_TEST_PORT: 1389
              run: composer exec -- phpunit -c _test/phpunit.xml --verbose --stderr --group plugin_pureldap_integration

            - name: Run Samba AD tests
              env:
                  LDAP_TEST_HOST: localhost
                  LDAP_TEST_PORT: 7389
              run: composer exec -- phpunit -c _test/phpunit.xml --verbose --stderr --group plugin_pureldap --filter '/^(ADClientTest|AuthTest|GroupHierarchyCacheTest)::/'

            - name: Dump fixture logs on failure
              if: failure()
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                set +e
                {
                  echo "## Integration failure dump for ${GITHUB_SHA::7}"
                  echo
                  echo '<details><summary>docker ps -a</summary>'
                  echo
                  echo '```'
                  docker ps -a
                  echo '```'
                  echo '</details>'
                  echo
                  echo '<details><summary>docker compose ps -a</summary>'
                  echo
                  echo '```'
                  docker compose -f _test/docker-compose.yml ps -a
                  echo '```'
                  echo '</details>'
                  echo
                  echo '<details><summary>docker compose logs</summary>'
                  echo
                  echo '```'
                  docker compose -f _test/docker-compose.yml logs --tail=500
                  echo '```'
                  echo '</details>'
                  for c in pureldap-openldap pureldap-samba; do
                    echo
                    echo "<details><summary>inspect $c</summary>"
                    echo
                    echo '```'
                    docker inspect "$c" --format '{{.State.Status}} ({{.State.ExitCode}}) {{.State.Error}}' 2>&1
                    echo '---'
                    docker exec "$c" sh -c 'for b in ldapadd ldapsearch ldapmodify python3 samba-tool slappasswd ldbmodify bash apt-get; do echo "  $b: $(command -v "$b" || echo MISSING)"; done' 2>&1
                    echo '---'
                    docker exec "$c" sh -c 'cat /etc/os-release 2>/dev/null | head -5' 2>&1
                    echo '```'
                    echo '</details>'
                  done
                } > /tmp/dump.md

                # Also echo to the workflow log
                cat /tmp/dump.md

                # And post as a comment on the PR (so the agent driving CI can read it via MCP).
                # gh CLI is preinstalled on ubuntu-latest runners; uses $GH_TOKEN.
                PR_NUM=$(gh pr list --state open --head "${GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "${GITHUB_REPOSITORY}")
                if [ -n "${PR_NUM}" ]; then
                  gh pr comment "${PR_NUM}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/dump.md
                else
                  echo "No open PR found for ${GITHUB_REF_NAME}; skipping comment."
                fi
