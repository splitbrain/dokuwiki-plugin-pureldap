name: Integration tests

# Single job. `docker compose run --rm provisioner` brings up both LDAP
# backends and applies users.json to each via the OO provisioner. After
# it exits, phpunit runs the openldap-targeted suite against localhost:1389
# and the AD-targeted suite against localhost:7389.

on: [push, pull_request]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    integration:
        name: Integration (PHP ${{ matrix.php-version }}, DokuWiki ${{ matrix.dokuwiki-branch }})
        runs-on: ubuntu-latest
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.2']
                dokuwiki-branch: ['master']

        env:
            COMPOSER: _test/composer.json
            COMPOSER_VENDOR_DIR: _test/vendor

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring, intl, PDO, pdo_sqlite, bz2

            - name: Setup problem matchers
              run: |
                echo ::add-matcher::${{ runner.tool_cache }}/php.json
                echo ::add-matcher::${{ runner.tool_cache }}/phpunit.json

            - name: Bring up fixtures
              # The provisioner has its own retry loops for both
              # backends, so we don't need healthchecks at the compose
              # layer. 'up -d' starts every service including the
              # provisioner; we then 'docker wait' for the provisioner
              # to exit and surface its logs + exit code. (Using 'up'
              # + 'docker wait' instead of 'compose run' so the
              # provisioner container persists for log inspection
              # after failure.)
              run: |
                set -e
                docker compose -f _test/docker-compose.yml up -d
                docker compose -f _test/docker-compose.yml ps -a
                provisioner_id=$(docker compose -f _test/docker-compose.yml ps -aq provisioner)
                echo "Waiting for provisioner ${provisioner_id} to finish..."
                exit_code=$(docker wait "${provisioner_id}")
                echo "---- provisioner logs ----"
                docker logs "${provisioner_id}"
                echo "---- provisioner exited ${exit_code} ----"
                [ "${exit_code}" = "0" ]

            - name: Create DokuWiki environment
              uses: dokuwiki/github-action/.github/actions/dokuenv@main
              with:
                  branch: ${{ matrix.dokuwiki-branch }}

            - name: Install composer dependencies
              run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader --no-scripts

            - name: Run OpenLDAP tests
              env:
                  LDAP_TEST_HOST: localhost
                  LDAP_TEST_PORT: 1389
              run: composer exec -- phpunit -c _test/phpunit.xml --verbose --stderr --group plugin_pureldap_integration

            - name: Run Samba AD tests
              env:
                  LDAP_TEST_HOST: localhost
                  LDAP_TEST_PORT: 7389
              run: composer exec -- phpunit -c _test/phpunit.xml --verbose --stderr --group plugin_pureldap --filter '/^(ADClientTest|AuthTest|GroupHierarchyCacheTest)::/'

            - name: Dump fixture logs on failure
              if: failure()
              run: |
                docker compose -f _test/docker-compose.yml ps -a
                docker compose -f _test/docker-compose.yml logs --tail=300 || true
