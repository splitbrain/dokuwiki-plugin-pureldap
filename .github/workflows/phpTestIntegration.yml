name: Integration tests

# Single workflow that drives every "real server" integration target —
# currently OpenLDAP and Samba 4 AD-DC. Each matrix entry points at a
# docker-compose fixture and a self-contained provision.sh that knows
# how to wait for that fixture, run any post-boot setup, and sanity-
# probe it with ldapsearch. Adding a new target means: drop in a
# compose file, drop in fixtures/<name>/provision.sh, add a matrix row.

on: [push, pull_request]

# Cancel any prior queued/running run for the same branch on a new push.
# Stops orphaned "queued" jobs from piling up when GitHub Actions has a
# runner-allocation hiccup.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    integration:
        name: ${{ matrix.fixture.label }} (PHP ${{ matrix.php-version }}, DokuWiki ${{ matrix.dokuwiki-branch }})
        runs-on: ubuntu-latest
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.2']
                dokuwiki-branch: ['master']
                fixture:
                    - name: openldap
                      label: OpenLDAP
                      compose: _test/docker-compose.openldap.yml
                      container: pureldap-openldap
                      port: 1389
                      phpunit_group: plugin_pureldap_integration
                      phpunit_filter: ''
                    - name: samba
                      label: Samba AD-DC
                      compose: _test/docker-compose.samba.yml
                      container: pureldap-samba
                      port: 7389
                      phpunit_group: plugin_pureldap
                      phpunit_filter: '/^(ADClientTest|AuthTest|GroupHierarchyCacheTest)::/'

        env:
            COMPOSER: _test/composer.json
            COMPOSER_VENDOR_DIR: _test/vendor

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Verify fixture artifacts are in sync with people.json
              run: |
                bash _test/fixtures/regenerate.sh
                if ! git diff --exit-code \
                        _test/fixtures/openldap/bootstrap.ldif \
                        _test/fixtures/samba/provision-data.sh; then
                    echo "::error::Generated fixture artifacts are stale. Run _test/fixtures/regenerate.sh and commit the result."
                    exit 1
                fi

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring, intl, PDO, pdo_sqlite, bz2

            - name: Setup problem matchers
              run: |
                echo ::add-matcher::${{ runner.tool_cache }}/php.json
                echo ::add-matcher::${{ runner.tool_cache }}/phpunit.json

            - name: Install ldap-utils for fixture probing
              run: sudo apt-get update -qq && sudo apt-get install -y -qq ldap-utils

            - name: Start ${{ matrix.fixture.label }} fixture
              run: |
                set -ex
                docker compose -f ${{ matrix.fixture.compose }} up -d
                docker compose -f ${{ matrix.fixture.compose }} ps

            - name: Provision and verify fixture
              run: bash _test/fixtures/${{ matrix.fixture.name }}/provision.sh

            - name: Create DokuWiki environment
              uses: dokuwiki/github-action/.github/actions/dokuenv@main
              with:
                  branch: ${{ matrix.dokuwiki-branch }}

            - name: Install composer dependencies
              run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader --no-scripts

            - name: Run phpunit
              env:
                  LDAP_TEST_HOST: localhost
                  LDAP_TEST_PORT: ${{ matrix.fixture.port }}
                  PHPUNIT_GROUP: ${{ matrix.fixture.phpunit_group }}
                  PHPUNIT_FILTER: ${{ matrix.fixture.phpunit_filter }}
              run: |
                if [ -n "$PHPUNIT_FILTER" ]; then
                    composer exec -- phpunit -c _test/phpunit.xml --verbose --stderr \
                        --group "$PHPUNIT_GROUP" --filter "$PHPUNIT_FILTER"
                else
                    composer exec -- phpunit -c _test/phpunit.xml --verbose --stderr \
                        --group "$PHPUNIT_GROUP"
                fi

            - name: Dump fixture logs on failure
              if: failure()
              run: docker logs ${{ matrix.fixture.container }} --tail=300 || true
