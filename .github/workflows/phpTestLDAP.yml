name: Tests for LDAP

on: [push, pull_request]

jobs:
    testLDAP:
        name: PHP ${{ matrix.php-versions }} DokuWiki ${{ matrix.dokuwiki-branch }}
        runs-on: ubuntu-latest
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

        strategy:
            matrix:
                php-versions: ['8.2']
                dokuwiki-branch: [ 'master']
            fail-fast: false

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Start OpenLDAP fixture
              run: docker compose -f _test/docker-compose.openldap.yml up -d

            - name: Wait for LDAP
              run: |
                for i in $(seq 1 60); do
                  if (echo > /dev/tcp/localhost/1389) 2>/dev/null; then
                    echo "LDAP port open after ${i}s"
                    # slapd needs a moment after the port opens to finish
                    # loading the bootstrap LDIF.
                    sleep 5
                    exit 0
                  fi
                  sleep 1
                done
                echo "LDAP did not come up in time"
                docker compose -f _test/docker-compose.openldap.yml logs
                exit 1

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: mbstring, intl, PDO, pdo_sqlite, bz2

            - name: Setup problem matchers
              run: |
                echo ::add-matcher::${{ runner.tool_cache }}/php.json
                echo ::add-matcher::${{ runner.tool_cache }}/phpunit.json

            - name: Download DokuWiki Test-setup
              run: wget https://raw.github.com/splitbrain/dokuwiki-travis/master/travis.sh

            - name: Run DokuWiki Test-setup
              env:
                  CI_SERVER: 1
                  DOKUWIKI: ${{ matrix.dokuwiki-branch }}
              run: sh travis.sh

            - name: Setup PHPUnit
              run: php _test/fetchphpunit.php

            - name: Run LDAPClient integration tests
              env:
                  LDAP_TEST_HOST: localhost
                  LDAP_TEST_PORT: 1389
              run: |
                cd _test
                php phpunit.phar --verbose --stderr --group plugin_pureldap_integration

            - name: Stop OpenLDAP fixture
              if: always()
              run: docker compose -f _test/docker-compose.openldap.yml down -v
