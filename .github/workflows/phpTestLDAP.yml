name: Tests for LDAP

# Drives the LDAPClient integration tests against an OpenLDAP fixture
# brought up via docker compose. The canonical dokuwiki.yml workflow
# (which calls dokuwiki/github-action/.github/workflows/all.yml) doesn't
# have a hook for service setup, so this workflow uses the dokuenv
# composite action directly and adds the compose-up step.

on: [push, pull_request]

# Cancel any prior queued/running run for the same branch on a new push.
# Stops orphaned "queued" jobs from piling up when GitHub Actions has a
# runner-allocation hiccup.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    testLDAP:
        name: LDAP integration tests (PHP ${{ matrix.php-version }}, DokuWiki ${{ matrix.dokuwiki-branch }})
        runs-on: ubuntu-latest
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

        strategy:
            matrix:
                php-version: ['8.2']
                dokuwiki-branch: ['master']
            fail-fast: false

        env:
            COMPOSER: _test/composer.json
            COMPOSER_VENDOR_DIR: _test/vendor

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring, intl, PDO, pdo_sqlite, bz2

            - name: Setup problem matchers
              run: |
                echo ::add-matcher::${{ runner.tool_cache }}/php.json
                echo ::add-matcher::${{ runner.tool_cache }}/phpunit.json

            - name: Install ldap-utils for probing
              run: sudo apt-get update && sudo apt-get install -y ldap-utils

            - name: Start OpenLDAP fixture
              run: |
                set -ex
                docker compose -f _test/docker-compose.openldap.yml up -d
                docker compose -f _test/docker-compose.openldap.yml ps

            - name: Wait for LDAP and verify fixture loaded
              run: |
                set -e
                # Wait up to 120s for the LDAP port to open.
                for i in $(seq 1 120); do
                  if (echo > /dev/tcp/localhost/1389) 2>/dev/null; then
                    echo "LDAP port open after ${i}s"
                    break
                  fi
                  sleep 1
                done
                if ! (echo > /dev/tcp/localhost/1389) 2>/dev/null; then
                  echo "::error::LDAP port never opened"
                  docker compose -f _test/docker-compose.openldap.yml logs
                  exit 1
                fi
                # Slapd needs a moment after the port opens to finish
                # ingesting the bootstrap LDIF.
                sleep 8
                # Sanity-probe: alice must resolve via the configured base DN.
                if ! ldapsearch -x -H ldap://localhost:1389 \
                       -b dc=example,dc=org \
                       -D cn=admin,dc=example,dc=org \
                       -w adminpass \
                       '(uid=alice)' uid mail \
                       | grep -q '^uid: alice'; then
                  echo "::error::Bootstrap LDIF did not load (alice not found)"
                  docker compose -f _test/docker-compose.openldap.yml logs
                  exit 1
                fi
                echo "Fixture verified — alice is searchable"

            - name: Create DokuWiki Environment
              id: dokuwiki-env
              uses: dokuwiki/github-action/.github/actions/dokuenv@main
              with:
                  branch: ${{ matrix.dokuwiki-branch }}

            - name: Install Composer Dependencies
              run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader --no-scripts

            - name: Run LDAPClient integration tests
              env:
                  LDAP_TEST_HOST: localhost
                  LDAP_TEST_PORT: 1389
              run: composer exec -- phpunit -c _test/phpunit.xml --verbose --stderr --group plugin_pureldap_integration

            - name: Dump OpenLDAP logs on failure
              if: failure()
              run: docker compose -f ${{ steps.dokuwiki-env.outputs.dir }}/_test/docker-compose.openldap.yml logs || docker logs pureldap-openldap || true
