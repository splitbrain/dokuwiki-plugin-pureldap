version: "3.8"

# OpenLDAP fixture for pureldap's LDAPClient integration tests.
#
# Usage:
#   docker compose -f _test/docker-compose.openldap.yml up -d
#   php _test/fixtures/provision.php --backend openldap
#   LDAP_TEST_HOST=localhost LDAP_TEST_PORT=1389 phpunit _test/integration/LDAPClientTest.php
#   docker compose -f _test/docker-compose.openldap.yml down
#
# Data lives in _test/fixtures/users.json and is loaded by provision.php
# via ldapadd after the container is up. The image starts empty — no
# auto-loaded bootstrap LDIF — so the test data path is identical to
# the Samba path: same JSON spec, same provisioner, different CLI.

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: pureldap-openldap
    environment:
      LDAP_ORGANISATION: "Pureldap Test"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "adminpass"
      LDAP_TLS: "false"
      # Stay on the default NIS schema. RFC 2307bis turns posixGroup
      # into an AUXILIARY objectClass, which would make provision.php's
      # group entries (posixGroup is structural) fail to add.
    ports:
      - "1389:389"
