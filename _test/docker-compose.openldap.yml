# OpenLDAP fixture for pureldap's LDAPClient integration tests.
#
# `docker compose -f _test/docker-compose.openldap.yml up -d --wait`
# is the complete fixture setup: the openldap service comes up empty,
# the provisioner sidecar waits for it to become healthy, applies
# users.json via ldapadd, and exits. By the time --wait returns the
# server is fully populated.
#
# Usage:
#   docker compose -f _test/docker-compose.openldap.yml up -d --wait
#   LDAP_TEST_HOST=localhost LDAP_TEST_PORT=1389 phpunit _test/integration/LDAPClientTest.php
#   docker compose -f _test/docker-compose.openldap.yml down

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: pureldap-openldap
    environment:
      LDAP_ORGANISATION: "Pureldap Test"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "adminpass"
      LDAP_TLS: "false"
      # Stay on the default NIS schema. RFC 2307bis turns posixGroup
      # into an AUXILIARY objectClass, which would make provision.php's
      # group entries (posixGroup is structural) fail to add.
    ports:
      - "1389:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapwhoami -x -H ldap://localhost >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  provisioner:
    image: php:8.2-cli-alpine
    depends_on:
      openldap:
        condition: service_healthy
    volumes:
      - ./fixtures:/fixtures:ro
    command:
      - sh
      - -c
      - |
        apk add --no-cache --quiet openldap-clients >/dev/null
        php /fixtures/provision.php --backend openldap
    restart: "no"
