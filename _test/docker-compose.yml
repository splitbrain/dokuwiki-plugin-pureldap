# Single compose file for both LDAP integration fixtures.
#
# Two services, each exposing a port to localhost. Each mounts
# fixtures/ read-only and runs provision.py via compose's post_start
# lifecycle hook (compose v2.30+) as the container starts. A sentinel
# file dropped by the script when it finishes drives a healthcheck —
# so 'docker compose up -d --wait' blocks until both backends are
# fully populated.
#
# Connection details for each backend's provisioner live as environment
# variables on the respective service block. users.json is pure data.

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: pureldap-openldap
    environment:
      LDAP_ORGANISATION: "Pureldap Test"
      LDAP_DOMAIN:       "example.org"
      LDAP_ADMIN_PASSWORD: "adminpass"
      LDAP_TLS: "false"
      # Stay on the default NIS schema. RFC 2307bis turns posixGroup
      # into an AUXILIARY objectClass, which would make the
      # provisioner's group entries (posixGroup is structural) fail.

      # Read by provision.py inside this container.
      PROVISION_HOST:      "localhost"
      PROVISION_PORT:      "389"
      PROVISION_BIND_DN:   "cn=admin,dc=example,dc=org"
      PROVISION_BIND_PW:   "adminpass"
      PROVISION_BASE:      "dc=example,dc=org"
      PROVISION_PEOPLE_OU: "ou=People,dc=example,dc=org"
      PROVISION_GROUPS_OU: "ou=Groups,dc=example,dc=org"
    ports:
      - "1389:389"
    volumes:
      - ./fixtures:/fixtures:ro
    post_start:
      - command: ["python3", "/fixtures/provision.py", "--backend", "openldap"]
    healthcheck:
      test: ["CMD-SHELL", "test -e /tmp/provisioned"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  samba:
    image: nowsci/samba-domain:latest
    container_name: pureldap-samba
    hostname: dc1
    # AD-DC needs to control its own hostname resolution
    domainname: example.local
    privileged: true
    environment:
      DOMAIN:         "EXAMPLE.LOCAL"
      DOMAINPASS:     "Vagrantvagrantvagrant1"
      DOMAIN_NETBIOS: "EXAMPLE"
      DOMAIN_EMAIL:   "admin@example.local"
      DNSFORWARDER:   "1.1.1.1"
      HOSTIP:         "127.0.0.1"
      INSECURELDAP:   "true"
      MULTISITE:      "false"
      NOCOMPLEXITY:   "false"
      DISABLE_DNS:    "false"

      # Read by provision.py inside this container.
      PROVISION_USERS_DN: "CN=Users,DC=example,DC=local"
    ports:
      - "7389:389"
      - "7636:636"
    volumes:
      - ./fixtures:/fixtures:ro
    post_start:
      - command: ["python3", "/fixtures/provision.py", "--backend", "samba"]
    healthcheck:
      # Samba's own first-boot domain provisioning takes 30-90s before
      # samba-tool responds, then provision.py creates 260+ users, so
      # the deadline here is wide.
      test: ["CMD-SHELL", "test -e /tmp/provisioned"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 60s
