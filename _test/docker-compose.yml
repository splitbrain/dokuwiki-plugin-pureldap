# Single compose file for both LDAP integration fixtures.
#
# tls-init is a one-shot service that generates a self-signed cert
# (CN=localhost, SAN: localhost/127.0.0.1/dc1.example.com) into a
# named volume. Both backends consume it: openldap reads it directly
# from the cert volume mounted at its expected path; samba's first-boot
# provisioning writes its own cert into /var/lib/samba/private/tls,
# so samba mounts the volume read-only at /certs and the per-backend
# setup.sh copies the shared cert into place after first-boot finishes.
#
# Provisioning itself is driven by the CI workflow via `docker exec`,
# not by compose post_start lifecycle hooks. The hook syntax is clean
# but requires compose v2.30+; the ubuntu-latest runner currently
# silently misbehaves on it (the previous attempt with post_start
# failed in ~30s with no logs). docker exec is portable everywhere.

volumes:
  tls-certs:

services:
  tls-init:
    image: alpine:3.20
    volumes:
      - tls-certs:/certs
    # Sequence form (not the `>` folded scalar) — the folded form preserved
    # newlines on the more-indented openssl args, which the shell then
    # treated as separate commands.
    command:
      - sh
      - -ec
      - |
        apk add --no-cache openssl >/dev/null
        if [ -f /certs/cert.pem ]; then exit 0; fi
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -keyout /certs/key.pem -out /certs/cert.pem \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,DNS:dc1.example.com,IP:127.0.0.1'
        cp /certs/cert.pem /certs/ca.pem
        chmod 644 /certs/*.pem

  openldap:
    image: osixia/openldap:1.5.0
    container_name: pureldap-openldap
    depends_on:
      tls-init:
        condition: service_completed_successfully
    environment:
      LDAP_ORGANISATION:        "Pureldap Test"
      LDAP_DOMAIN:              "example.com"
      LDAP_ADMIN_PASSWORD:      "Foo_b_ar123!"
      LDAP_TLS:                 "true"
      LDAP_TLS_CRT_FILENAME:    "cert.pem"
      LDAP_TLS_KEY_FILENAME:    "key.pem"
      LDAP_TLS_CA_CRT_FILENAME: "ca.pem"
      LDAP_TLS_VERIFY_CLIENT:   "never"
    ports:
      - "1389:389"
      - "1636:636"
    volumes:
      - ./fixtures:/fixtures:ro
      - tls-certs:/container/service/slapd/assets/certs

  samba:
    image: nowsci/samba-domain:latest
    container_name: pureldap-samba
    hostname: dc1
    domainname: example.com
    privileged: true
    depends_on:
      tls-init:
        condition: service_completed_successfully
    environment:
      DOMAIN:         "EXAMPLE.COM"
      DOMAINPASS:     "Foo_b_ar123!"
      DOMAIN_NETBIOS: "EXAMPLE"
      DOMAIN_EMAIL:   "admin@example.com"
      DNSFORWARDER:   "1.1.1.1"
      HOSTIP:         "127.0.0.1"
      INSECURELDAP:   "true"
    ports:
      - "7389:389"
      - "7636:636"
    volumes:
      - ./fixtures:/fixtures:ro
      - tls-certs:/certs:ro
