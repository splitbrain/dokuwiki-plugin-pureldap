# Single compose file for both LDAP integration fixtures.
#
# tls-init is a one-shot that generates a single self-signed cert
# covering localhost / 127.0.0.1 / dc1.example.com into a named
# volume. Both backends consume it: openldap reads it directly; samba
# can't, because its first-boot provisioning writes its own cert into
# the same path — so samba mounts the volume read-only at /certs and
# samba/setup.sh copies it into /var/lib/samba/private/tls after
# first-boot has finished.
#
# Both backends use post_start to run a tiny setup.sh followed by a
# csv-driven provision.py. The scripts touch /tmp/provisioned when
# done; a healthcheck reads that, so `docker compose up -d --wait`
# blocks until both backends are fully populated.

volumes:
  tls-certs:

services:
  tls-init:
    image: alpine:3.20
    volumes:
      - tls-certs:/certs
    command: >
      sh -c "apk add --no-cache openssl >/dev/null &&
             [ -f /certs/cert.pem ] && exit 0 ||
             openssl req -x509 -newkey rsa:2048 -nodes -days 3650
               -keyout /certs/key.pem -out /certs/cert.pem
               -subj '/CN=localhost'
               -addext 'subjectAltName=DNS:localhost,DNS:dc1.example.com,IP:127.0.0.1' &&
             cp /certs/cert.pem /certs/ca.pem &&
             chmod 644 /certs/*.pem"

  openldap:
    image: osixia/openldap:1.5.0
    container_name: pureldap-openldap
    depends_on:
      tls-init:
        condition: service_completed_successfully
    environment:
      LDAP_ORGANISATION:        "Pureldap Test"
      LDAP_DOMAIN:              "example.com"
      LDAP_ADMIN_PASSWORD:      "Foo_b_ar123!"
      LDAP_TLS:                 "true"
      LDAP_TLS_CRT_FILENAME:    "cert.pem"
      LDAP_TLS_KEY_FILENAME:    "key.pem"
      LDAP_TLS_CA_CRT_FILENAME: "ca.pem"
      LDAP_TLS_VERIFY_CLIENT:   "never"
    ports:
      - "1389:389"
      - "1636:636"
    volumes:
      - ./fixtures:/fixtures:ro
      - tls-certs:/container/service/slapd/assets/certs
    post_start:
      - command: ["bash",    "/fixtures/openldap/setup.sh"]
      - command: ["python3", "/fixtures/openldap/provision.py"]
    healthcheck:
      test: ["CMD-SHELL", "test -e /tmp/provisioned"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  samba:
    image: nowsci/samba-domain:latest
    container_name: pureldap-samba
    hostname: dc1
    domainname: example.com
    privileged: true
    depends_on:
      tls-init:
        condition: service_completed_successfully
    environment:
      DOMAIN:         "EXAMPLE.COM"
      DOMAINPASS:     "Foo_b_ar123!"
      DOMAIN_NETBIOS: "EXAMPLE"
      DOMAIN_EMAIL:   "admin@example.com"
      DNSFORWARDER:   "1.1.1.1"
      HOSTIP:         "127.0.0.1"
      INSECURELDAP:   "true"
    ports:
      - "7389:389"
      - "7636:636"
    volumes:
      - ./fixtures:/fixtures:ro
      - tls-certs:/certs:ro
    post_start:
      - command: ["bash",    "/fixtures/samba/setup.sh"]
      - command: ["python3", "/fixtures/samba/provision.py"]
    healthcheck:
      # First-boot domain provisioning takes 30-90s before samba-tool
      # responds, then provision.py creates 300+ users — the deadline
      # here is wide.
      test: ["CMD-SHELL", "test -e /tmp/provisioned"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 60s
