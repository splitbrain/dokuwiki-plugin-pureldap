# Single compose file for both LDAP integration fixtures.
#
# Two services, each exposing a port to localhost. Each mounts
# fixtures/ read-only; provision.py inside that directory is invoked
# via 'docker exec' (e.g. by the CI workflow or by hand) once the
# containers are up. The script handles its own readiness wait —
# slapd binds in seconds, samba's AD-DC takes 30-90s.
#
# Local usage:
#   docker compose -f _test/docker-compose.yml up -d
#   docker exec pureldap-openldap python3 /fixtures/provision.py --backend openldap
#   docker exec pureldap-samba    python3 /fixtures/provision.py --backend samba
#   # then point phpunit at localhost:1389 / localhost:7389
#
# Connection details for each backend's provisioner are environment
# variables on the matching service block. users.json is pure data.

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: pureldap-openldap
    environment:
      LDAP_ORGANISATION: "Pureldap Test"
      LDAP_DOMAIN:       "example.org"
      LDAP_ADMIN_PASSWORD: "adminpass"
      LDAP_TLS: "false"
      # Stay on the default NIS schema. RFC 2307bis turns posixGroup
      # into an AUXILIARY objectClass, which would make the
      # provisioner's group entries (posixGroup is structural) fail.

      # Read by provision.py inside this container.
      PROVISION_HOST:      "localhost"
      PROVISION_PORT:      "389"
      PROVISION_BIND_DN:   "cn=admin,dc=example,dc=org"
      PROVISION_BIND_PW:   "adminpass"
      PROVISION_BASE:      "dc=example,dc=org"
      PROVISION_PEOPLE_OU: "ou=People,dc=example,dc=org"
      PROVISION_GROUPS_OU: "ou=Groups,dc=example,dc=org"
    ports:
      - "1389:389"
    volumes:
      - ./fixtures:/fixtures:ro

  samba:
    image: nowsci/samba-domain:latest
    container_name: pureldap-samba
    hostname: dc1
    # AD-DC needs to control its own hostname resolution
    domainname: example.local
    privileged: true
    environment:
      DOMAIN:         "EXAMPLE.LOCAL"
      DOMAINPASS:     "Vagrantvagrantvagrant1"
      DOMAIN_NETBIOS: "EXAMPLE"
      DOMAIN_EMAIL:   "admin@example.local"
      DNSFORWARDER:   "1.1.1.1"
      HOSTIP:         "127.0.0.1"
      INSECURELDAP:   "true"
      MULTISITE:      "false"
      NOCOMPLEXITY:   "false"
      DISABLE_DNS:    "false"

      # Read by provision.py inside this container.
      PROVISION_USERS_DN: "CN=Users,DC=example,DC=local"
    ports:
      - "7389:389"
      - "7636:636"
    volumes:
      - ./fixtures:/fixtures:ro

