# Samba 4 AD-DC fixture for pureldap's ADClient tests.
#
# Stands in for splitbrain/vagrant-active-directory — close enough on
# protocol surface (sAMAccountName, UPN, memberOf, primaryGroupID,
# unicodePwd, maxPwdAge, userAccountControl) that ADClientTest et al.
# pass without server-specific tweaks.
#
# `docker compose -f _test/docker-compose.samba.yml up -d --wait` is the
# complete fixture setup: samba starts and self-provisions the domain,
# the provisioner sidecar waits for samba-tool to respond, applies
# users.json via docker-exec → samba-tool/ldbmodify (against this very
# container), and reissues the LDAPS cert with a localhost SAN. The
# provisioner needs docker socket access for the exec; that's fine for
# the test environment but obviously not a pattern to copy to prod.
#
# Usage:
#   docker compose -f _test/docker-compose.samba.yml up -d --wait
#   php phpunit.phar --group plugin_pureldap _test/ADClientTest.php
#   docker compose -f _test/docker-compose.samba.yml down -v

services:
  samba:
    image: nowsci/samba-domain:latest
    container_name: pureldap-samba
    hostname: dc1
    # AD-DC needs to control its own hostname resolution
    domainname: example.local
    privileged: true
    environment:
      DOMAIN: "EXAMPLE.LOCAL"
      DOMAINPASS: "Vagrantvagrantvagrant1"
      DOMAIN_NETBIOS: "EXAMPLE"
      DOMAIN_EMAIL: "admin@example.local"
      DNSFORWARDER: "1.1.1.1"
      HOSTIP: "127.0.0.1"
      INSECURELDAP: "true"
      MULTISITE: "false"
      NOCOMPLEXITY: "false"
      DISABLE_DNS: "false"
    ports:
      - "7389:389"
      - "7636:636"
    volumes:
      - ./fixtures/samba/regen-tls.sh:/regen-tls.sh:ro
    healthcheck:
      # samba-tool only starts responding once domain provisioning has
      # finished, which takes 30-90s after first boot. The wide timeout
      # accommodates that.
      test: ["CMD-SHELL", "samba-tool user list >/dev/null 2>&1"]
      interval: 5s
      timeout: 30s
      retries: 60
      start_period: 30s

  provisioner:
    image: php:8.2-cli-alpine
    depends_on:
      samba:
        condition: service_healthy
    volumes:
      - ./fixtures:/fixtures:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - |
        apk add --no-cache --quiet docker-cli >/dev/null
        php /fixtures/provision.php --backend samba
    restart: "no"
